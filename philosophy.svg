<svg xmlns="http://www.w3.org/2000/svg" width="760" height="140" viewBox="0 0 760 140">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#FF3D71"/>
    </linearGradient>

    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="140">
        <animate attributeName="width" from="0" to="720" dur="3s" begin="1s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="760" height="140" rx="10" fill="#0D1117"/>

  <!-- Строка-приглашение -->
  <text x="30" y="50" fill="#E6EDF3" font-family="'SF Mono', Consolas, monospace" font-size="14">
    <tspan fill="#A855F7">alex</tspan><tspan fill="#666">@</tspan><tspan fill="#FF3D71">dev</tspan><tspan fill="#666">:~$ </tspan><tspan fill="#E11D48">echo "philosophy"</tspan>
  </text>

  <!-- Фраза с анимацией печати -->
  <g clip-path="url(#reveal)">
    <text x="30" y="105" fill="url(#textGrad)" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="600">
      如果我和其他人一样，那么谁会像我一样？
    </text>
  </g>

  <!-- Курсор -->
  <rect x="30" y="87" width="2" height="26" fill="#E11D48">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="x" from="30" to="670" dur="3s" begin="1s" fill="freeze"/>
  </rect>
</svg>
